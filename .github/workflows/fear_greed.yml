name: Fear and Greed Tracker

# Runs at the start of each 6-hour slot (00/06/12/18 UTC) and then again
# 1, 2 and 3 hours later as RETRY windows. The slot guard makes every run
# after a successful one exit immediately, so no ScraperAPI credits are
# spent once the slot already has its data.
on:
  schedule:
    - cron: '10 0,1,2,3,6,7,8,9,12,13,14,15,18,19,20,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Does this 6h slot already have data?
        id: guard
        run: |
          DECISION=$(python3 slot_guard.py data/fear_greed_log.csv 1 2)
          echo "Slot decision: $DECISION"
          echo "decision=$DECISION" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.guard.outputs.decision == 'run'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.guard.outputs.decision == 'run'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        if: steps.guard.outputs.decision == 'run'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPE_ATTEMPTS: '2'
        run: python fear_greed.py

      - name: Commit data log
        if: always() && steps.guard.outputs.decision == 'run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fear_greed_log.csv || true
          git diff --staged --quiet || git commit -m "Log data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true
